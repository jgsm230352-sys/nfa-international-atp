name: Generate four natural American lesson narrations
on:
  push:
    paths:
      - '.github/workflows/lesson01-four-voices.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install neural voice synthesis
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate four chapters
        run: |
          mkdir -p audio
          cat > /tmp/lesson01.py <<'PY'
          import asyncio
          import edge_tts
          chapters = [
            "Certification framework. The Federal Aviation Administration, or F A A, regulates civil aviation certification in the United States. Title fourteen of the Code of Federal Regulations contains the applicable rules. An Airline Transport Pilot certificate does not replace aircraft ratings, medical requirements, or operational authorizations.",
            "Certificates and ratings. Distinguish between a pilot certificate, an aircraft category, a class rating, and a type rating. A T P is the certificate level. Airplane is the category, and Multiengine Land is the class. A type rating is required when specified for the aircraft and operation.",
            "Knowledge test and practical test. The knowledge test evaluates aeronautical knowledge through objective questions. The practical test follows the applicable Airman Certification Standards, covering knowledge, risk management, and flight skills. Passing one test does not replace the other.",
            "Applicant responsibilities. Confirm eligibility, aeronautical experience, documentation, required training, and the current version of the applicable regulations. Next Flight Academy provides academic preparation; it does not issue F A A pilot certificates."
          ]
          async def main():
              for i, text in enumerate(chapters, 1):
                  output = f"audio/nfa_lesson01_chapter{i:02d}_natural.mp3"
                  for attempt in range(1, 4):
                      try:
                          await edge_tts.Communicate(text, voice="en-US-GuyNeural", rate="-12%", pitch="-2Hz").save(output)
                          break
                      except Exception as exc:
                          print(f"Chapter {i}, attempt {attempt}: {exc}", flush=True)
                          if attempt == 3:
                              raise
                          await asyncio.sleep(attempt * 5)
                  print(output, flush=True)
          asyncio.run(main())
          PY
          python /tmp/lesson01.py
          for f in audio/nfa_lesson01_chapter0{1,2,3,4}_natural.mp3; do test -s "$f"; done
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/nfa_lesson01_chapter0{1,2,3,4}_natural.mp3
          git diff --cached --quiet || git commit -m "Complete four natural voice narrations for lesson 01"
          git pull --rebase origin main
          git push origin HEAD:main
