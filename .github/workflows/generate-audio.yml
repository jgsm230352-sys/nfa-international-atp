name: Generate NFA lesson audio
on:
  push:
    paths:
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install offline speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Create English narration
        run: |
          mkdir -p audio
          cat > /tmp/nfa-chapter.txt <<'EOF'
          Certification framework. The Federal Aviation Administration, or F A A, regulates civil aviation certification in the United States. Title fourteen of the Code of Federal Regulations contains the applicable rules. An Airline Transport Pilot certificate does not replace aircraft ratings, medical requirements, or operational authorizations.
          EOF
          espeak-ng -v en-us -s 132 -f /tmp/nfa-chapter.txt -w /tmp/nfa-chapter.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/nfa-chapter.wav -codec:a libmp3lame -b:a 64k audio/nfa_lesson01_chapter01.mp3
          test -s audio/nfa_lesson01_chapter01.mp3
      - name: Publish audio in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/nfa_lesson01_chapter01.mp3
          git diff --cached --quiet || (git commit -m "Publish NFA lesson 01 chapter 01 narration" && git push)
