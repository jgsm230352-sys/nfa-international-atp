const lessons=[{"n":1,"title":"Understanding the FAA Certification System","chap":[["Estrutura da certificação","A Federal Aviation Administration (FAA) regula a certificação civil nos Estados Unidos. O Title 14 do Code of Federal Regulations (14 CFR) reúne as regras aplicáveis. Um certificado ATP não substitui habilitações, requisitos médicos ou autorizações operacionais."],["Certificados e habilitações","Diferencie pilot certificate, category, class e type rating. ATP é o nível de certificado; Airplane Multiengine Land (AMEL) identifica categoria e classe. Habilitação de tipo é exigida conforme a aeronave e a operação."],["Knowledge test e practical test","O knowledge test avalia conhecimentos por questões objetivas. O practical test segue o Airman Certification Standards (ACS), incluindo conhecimento, gerenciamento de riscos e habilidades. Aprovação em uma etapa não substitui outra."],["Responsabilidades do candidato","Verifique elegibilidade, experiência, documentos, treinamento exigido e a edição vigente das normas. A NFA oferece preparação acadêmica, não certificação FAA."]]},{"n":2,"title":"ATP Eligibility Requirements","chap":[["§ 61.153 — Elegibilidade","Examine idade, idioma inglês, conduta e demais condições regulamentares aplicáveis ao certificado ATP. A elegibilidade deve ser comprovada documentalmente."],["§ 61.159 — Experiência","A experiência aeronáutica para ATP avião envolve requisitos específicos de tempo total e componentes como cross-country, night, instrument e PIC, com regras e créditos aplicáveis. Tempo total isolado não comprova elegibilidade."],["§ 61.160 — Restricted ATP","O restricted ATP segue critérios particulares. Não presuma que a elegibilidade para uma modalidade equivale à do ATP irrestrito."],["§§ 61.155–61.157 — Testes","Distinga requisitos de conhecimentos, treinamento ATP-CTP quando aplicável e proficiência prática. Prepare uma matriz documental antes de solicitar exames."]]},{"n":3,"title":"Foreign License Verification and Documentation","chap":[["Licença estrangeira e certificação FAA","Uma licença emitida no Brasil não se transforma automaticamente em ATP FAA. O caminho escolhido determina verificações, documentos e testes exigidos."],["Verificação de autenticidade","A FAA possui procedimentos para verificar determinadas licenças estrangeiras. Confirme o processo aplicável ao objetivo; não confunda a certificação baseada em licença estrangeira do § 61.75 com todos os percursos ATP."],["Documentos e consistência","Organize licença, habilitações, certificado médico pertinente, identidade, registros de experiência e comprovantes de treinamento. Divergências de nomes, datas e categorias podem atrasar a análise."],["Planejamento do processo","Antes de agendar exames, confira requisitos vigentes, prazos de verificação, documentação aceita e instruções da FAA e do examinador autorizado."]]},{"n":4,"title":"ATP Certification Pathway","chap":[["Definir o objetivo","Especifique ATP Airplane Multiengine Land (AMEL), eventual habilitação de tipo e a experiência anterior. Isso evita confundir certificação individual com qualificação de operador."],["Auditoria de elegibilidade","Compare cada requisito de § 61.153 e § 61.159 com evidências do candidato. Identifique lacunas antes de contratar treinamento."],["ATP-CTP e knowledge test","No percurso em que § 61.156 se aplica, complete o Airline Transport Pilot Certification Training Program (ATP-CTP) exigido antes de solicitar o knowledge test correspondente."],["Practical test e emissão","Após cumprir os requisitos pertinentes, o candidato segue para o teste prático conforme o ACS aplicável. A NFA não realiza emissão de certificados nem oferece ATP-CTP autorizado."]]},{"n":5,"title":"Understanding 14 CFR and FAA Regulatory Authority","chap":[["5.1 — Autoridade FAA","A FAA atua sob autoridade legal federal. O Title 14 CFR estabelece regras vinculantes para a aviação civil. Identifique a norma vigente e sua aplicabilidade."],["5.2 — Como ler o CFR","Em § 91.175(c), 91 é a parte, 175 a seção e (c) o parágrafo. Leia condições, exceções e referências cruzadas antes de concluir."],["5.3 — Regulamento versus orientação","Regulamentos são obrigatórios; Advisory Circulars normalmente apresentam orientação. AIM oferece informação operacional e ACS estabelece padrões de avaliação prática."],["5.4 — Part 61","Part 61 regula certificação de pilotos. Para ATP avião, consulte §§ 61.153, 61.155, 61.156, 61.157, 61.159 e 61.160 quando aplicáveis."],["5.5 — Part 91 e PIC","§ 91.3 atribui responsabilidade e autoridade final ao piloto em comando. Desvio de regra Part 91 em emergência imediata limita-se ao necessário para enfrentar a situação."],["5.6 — Mínimos IFR","§ 91.175 estabelece condições para descer abaixo de DA/DH ou MDA, incluindo visibilidade de voo, referências visuais e posição para pouso com descida normal."],["5.7 — Part 97","Procedimentos IFR publicados devem ser usados com cartas vigentes, NOTAMs e restrições aplicáveis. Publicação não significa disponibilidade irrestrita."],["5.8 — Part 119","Part 119 aborda certificação e aplicabilidade de operadores. Certificado ATP individual não é certificado de empresa aérea."],["5.9 — Part 121","Operações de transporte aéreo Part 121 possuem requisitos específicos de tripulação, treinamento, despacho, desempenho e limitações."],["5.10 — Part 135","Part 135 rege determinadas operações commuter e on-demand. Natureza do serviço e certificado do operador determinam aplicabilidade."],["5.11 — Alternado IFR","Sob a regra geral § 91.169(c), o critério 1-2-3 usa uma hora antes/depois da chegada, teto de 2.000 ft acima do aeroporto e visibilidade de 3 statute miles, ressalvadas exceções."],["5.12 — Combustível IFR","§ 91.167, para avião sob a regra geral, prevê combustível até destino, alternado quando exigido e mais 45 minutos em velocidade normal de cruzeiro."],["5.13 — Aeronavegabilidade e MEL","§ 91.7 exige aeronave aeronavegável. Equipamento inoperante exige análise das regras aplicáveis, incluindo § 91.213 e eventual Minimum Equipment List (MEL)."],["5.14 — ATP-CTP","§ 61.156 exige ATP-CTP no percurso correspondente antes do knowledge test ATP AMEL. Experiência prévia não é dispensa automática."],["5.15 — ACS e julgamento","O ATP Airplane ACS organiza conhecimentos, riscos e habilidades. Exames de conhecimento e avaliação prática são distintos; decisões devem ser justificadas pela norma e pelo risco."],["5.16 — Oral Review","Explique em inglês: What is the difference between Part 91 and Part 121? When may the PIC deviate from a regulation? What are the conditions to descend below DA?"]]}];

const englishLessonOne=[["Certification framework","The Federal Aviation Administration, or FAA, regulates civil aviation certification in the United States. Title 14 of the Code of Federal Regulations contains the applicable rules. An Airline Transport Pilot certificate does not replace aircraft ratings, medical requirements, or operational authorizations."],["Certificates and ratings","Distinguish between a pilot certificate, an aircraft category, a class rating, and a type rating. ATP is the certificate level. Airplane is the category, and Multiengine Land is the class. A type rating is required when specified for the aircraft and operation."],["Knowledge test and practical test","The knowledge test evaluates aeronautical knowledge through objective questions. The practical test follows the applicable Airman Certification Standards, covering knowledge, risk management, and flight skills. Passing one test does not replace the other."],["Applicant responsibilities","Confirm eligibility, aeronautical experience, documentation, required training, and the current version of the applicable regulations. Next Flight Academy provides academic preparation; it does not issue FAA pilot certificates."]];
const bank=[[["Which part primarily governs pilot certification?",["Part 61","Part 97","Part 119"],0,3,"Part 61 regula certificados e habilitações."],["An Advisory Circular generally...",["Overrides the CFR","Provides guidance","Automatically amends regulations"],1,2,"ACs geralmente oferecem orientação."],["At DA without required visual references, the pilot should...",["Continue","Descend if autopilot is engaged","Execute missed approach"],2,5,"§ 91.175 estabelece condições para prosseguir."],["Which Part addresses operator certification?",["Part 119","Part 61","Part 97"],0,7,"Part 119 trata de certificação de operadores."],["An ATP certificate alone certifies an airline.",["True","False"],1,7,"Certificação individual e do operador são distintas."],["Certain on-demand operations are governed by...",["Part 135","Part 97","Part 61 only"],0,9,"Part 135 cobre determinadas operações on-demand."],["Before applying a rule, determine...",["The easiest interpretation","Regulatory applicability","Only the aircraft model"],1,1,"O contexto operacional determina as regras aplicáveis."],["An emergency deviation under §91.3 is permitted...",["Without limit","To the extent required","Only with written permission"],1,4,"Desvio limitado à necessidade da emergência."],["ATP airplane experience is addressed in...",["§61.159","§91.3","Part 97"],0,3,"§61.159 contém os componentes de experiência."],["An IFR procedure must be assessed with...",["Old charts","Current publications and restrictions","Only ATC clearance"],1,6,"Cartas, NOTAMs e restrições vigentes importam."]],[["Destination forecast 1,800 ft ceiling and 4 SM visibility in the relevant Part 91 window. No exception. Alternate?",["No","Yes","Only below 1 SM"],1,10,"O teto não atende ao critério geral de 2.000 ft."],["Part 91 IFR airplane fuel after reaching the required alternate?",["15 min","30 min","45 min normal cruise"],2,11,"§91.167 prevê 45 minutos."],["ATC clearance seems unsafe due to terrain. No emergency. Crew should...",["Comply without question","Clarify with ATC","Ignore ATC"],1,4,"Responsabilidade do PIC exige esclarecer a situação."],["An inoperative item is logged. Before departure...",["Depart","Check airworthiness and relief","Ignore if short flight"],1,12,"Registro não substitui análise MEL/aeronavegabilidade."],["Experienced captain without required ATP-CTP should...",["Skip training","Complete required ATP-CTP","Complete after issuance"],1,13,"§61.156 aplica-se ao percurso descrito."],["Part 121 adds an applicable dispatch limitation. Crew should...",["Use only Part 91","Choose easiest","Comply with applicable Part 121 requirements"],2,8,"Normas específicas do operador também se aplicam."],["Emergency deviation scope under §91.3?",["Only extent necessary","Unlimited","Only international"],0,4,"A extensão deve ser necessária à emergência."],["1,650 total hours alone establishes ATP eligibility?",["Yes","No, verify components","Yes with foreign license"],1,3,"§61.159 requer componentes específicos."],["Which is the ATP airplane practical test standard?",["FAA-S-ACS-11A","AIM only","Part 119"],0,14,"O ACS contém os padrões de avaliação prática."],["Legal compliance and risk management...",["Are identical","Are alternatives","Are complementary"],2,14,"Conformidade e análise de riscos são complementares."]]];
let lesson=0,tab="resumo",mode=0,idx=0;const saved={};const el=document.getElementById("content");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("lesson").innerHTML=lessons.map((l,i)=>'<option value="'+i+'">Aula '+String(l.n).padStart(2,"0")+' — '+esc(l.title)+'</option>').join("");
document.getElementById("lesson").onchange=e=>{audioStop();lesson=+e.target.value;idx=0;mode=0;render()};

let audioChapter=-1,audioUtterance=null,audioVoice=null;
function audioMessage(message){const e=document.getElementById("audio-status");if(e)e.textContent=message}
function audioStop(){if("speechSynthesis" in window)window.speechSynthesis.cancel();audioChapter=-1;audioUtterance=null;audioMessage("Leitura interrompida.")}
function pickEnglishVoice(){const v=window.speechSynthesis.getVoices();return v.find(x=>x.lang.toLowerCase()==="en-us"&&x.localService)||v.find(x=>x.lang.toLowerCase()==="en-us")||v.find(x=>x.lang.toLowerCase().startsWith("en"))||null}
function speakChapter(i){
if(!("speechSynthesis" in window)||!window.SpeechSynthesisUtterance){audioMessage("Síntese de voz indisponível neste navegador.");return}
const synth=window.speechSynthesis;
if(audioChapter===i&&synth.paused){synth.resume();audioMessage("Continuando a leitura.");return}
if(audioChapter===i&&synth.speaking){synth.pause();audioMessage("Leitura pausada.");return}
synth.cancel();audioChapter=i;
const u=new SpeechSynthesisUtterance(englishLessonOne[i][0]+". "+englishLessonOne[i][1]);audioUtterance=u;
u.lang="en-US";u.rate=0.88;u.pitch=1;u.volume=1;
const v=pickEnglishVoice();if(v)u.voice=v;
u.onstart=()=>audioMessage("Reproduzindo áudio em inglês"+(v?" — "+v.name:"")+".");
u.onend=()=>{audioChapter=-1;audioUtterance=null;audioMessage("Leitura concluída.")};
u.onerror=e=>{audioChapter=-1;audioUtterance=null;audioMessage("Falha na reprodução: "+(e.error||"erro não identificado")+".")};
audioMessage("Iniciando voz inglesa"+(v?" — "+v.name:"")+".");
synth.speak(u);
}

let lesson6Language="pt",lesson6SpeechToken=0,lesson6SpeechPaused=false;
function lesson6SetLanguage(lang){lesson6StopSpeech();lesson6Language=lang;render()}
function lesson6StopSpeech(){lesson6SpeechToken++;lesson6SpeechPaused=false;if("speechSynthesis" in window)window.speechSynthesis.cancel();const e=document.getElementById("lesson6-audio-status");if(e)e.textContent="Leitura interrompida."}
function lesson6PauseResume(){
if(!("speechSynthesis" in window))return;
const s=window.speechSynthesis;
if(s.paused){s.resume();lesson6SpeechPaused=false;lesson6Status("Leitura retomada.")}
else if(s.speaking){s.pause();lesson6SpeechPaused=true;lesson6Status("Leitura pausada.")}
}
function lesson6Status(t){const e=document.getElementById("lesson6-audio-status");if(e)e.textContent=t}
function lesson6SpeakChapter(i){
if(!("speechSynthesis" in window)||!window.SpeechSynthesisUtterance){lesson6Status("Voz não disponível neste navegador.");return}
const c=lesson6.englishChapters[i];if(!c)return;
lesson6StopSpeech();const token=lesson6SpeechToken,synth=window.speechSynthesis;
const plain=(c.title+". "+c.body).replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,"$1").replace(/[#*|_]/g," ").replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").trim();
const chunks=plain.match(/.{1,260}(?:[.!?](?:\s|$)|\s|$)/g)||[plain];
let pos=0;const voice=pickEnglishVoice();
function next(){
if(token!==lesson6SpeechToken)return;
if(pos>=chunks.length){lesson6Status("Narração concluída.");return}
const u=new SpeechSynthesisUtterance(chunks[pos++]);u.lang="en-US";u.rate=0.88;u.pitch=1;if(voice)u.voice=voice;
u.onend=()=>{if(token===lesson6SpeechToken)next()};
u.onerror=e=>{if(token===lesson6SpeechToken)lesson6Status("Reprodução interrompida: "+(e.error||"erro")+".")};
synth.speak(u)
}
lesson6Status("Narrando capítulo "+(i+1)+" em inglês americano"+(voice?" — "+voice.name:"")+".");next()
}
function lesson6EnglishView(){
const english=lesson6Language==="en",chapters=english?lesson6.englishChapters:lesson6.chapters;
return '<div style="padding:12px;background:#f7f8f7;border-radius:9px;margin:12px 0"><strong>Idioma da Aula 06 / Lesson 06 language</strong><div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="'+(!english?'active':'')+'" onclick="lesson6SetLanguage(\'pt\')">Português · texto</button><button class="'+(english?'active':'')+'" onclick="lesson6SetLanguage(\'en\')">English · text + voice</button></div><p class="muted">'+(english?'Full lesson in American English with browser-based narration.':'Aula completa em português, sem narração.')+'</p></div>'+
chapters.map((c,i)=>'<details id="c'+i+'"><summary>'+esc(c.title)+'</summary>'+renderLesson6Markdown(c.body)+(english?'<div style="padding:12px;background:#f7f8f7;border-radius:9px;margin:12px 0" lang="en"><strong>American English narration · Chapter '+(i+1)+'</strong><div class="actions" style="justify-content:flex-start;margin-top:9px"><button onclick="lesson6SpeakChapter('+i+')">▶ Play chapter</button><button onclick="lesson6PauseResume()">Pause / Resume</button><button onclick="lesson6StopSpeech()">Stop</button></div><p class="muted" id="lesson6-audio-status" aria-live="polite">Voice provided by your browser. No audio in Portuguese.</p></div>':'')+'<p><a target="_blank" rel="noopener" href="https://www.ecfr.gov/current/title-14">Consultar eCFR oficial</a></p></details>').join("")
}

function renderLesson6Markdown(md){
 const lines=String(md).split(/\r?\n/);let out="",inTable=false,inList=false;
 function inline(t){return esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,(_m,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener">'+label+'</a>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
 function close(){if(inTable){out+='</tbody></table>';inTable=false}if(inList){out+='</ul>';inList=false}}
 for(const line of lines){const t=line.trim();if(!t){close();continue}
 if(/^\|(?:\s*[-:]+\s*\|)+$/.test(t))continue;
 if(t.startsWith('|')&&t.endsWith('|')){if(inList){out+='</ul>';inList=false}if(!inTable){out+='<table class="lesson6-table"><tbody>';inTable=true}out+='<tr>'+t.slice(1,-1).split('|').map(v=>'<td>'+inline(v.trim())+'</td>').join('')+'</tr>';continue}
 if(inTable){out+='</tbody></table>';inTable=false}
 if(/^---+$/.test(t)){close();out+='<hr>';continue}
 if(/^#{1,4} /.test(t)){close();const level=Math.min(4,(t.match(/^#+/)[0].length)+2);out+='<h'+level+'>'+inline(t.replace(/^#+\s*/,''))+'</h'+level+'>';continue}
 if(/^[-*] /.test(t)){if(!inList){out+='<ul>';inList=true}out+='<li>'+inline(t.slice(2))+'</li>';continue}
 if(inList){out+='</ul>';inList=false}
 if(/^\d+\. /.test(t)){out+='<p>'+inline(t)+'</p>';continue}
 out+='<p>'+inline(t.replace(/^>\s*/,''))+'</p>';
 }close();return out;
}

function qs(){return lesson===5&&lesson6?lesson6.questions[mode].map(q=>[q.q,q.options,q.answer,q.chapter,q.explanation]):lesson===4?bank[mode]:[[ "What is the main regulatory reference for FAA pilot certification?",["14 CFR Part 61","Part 97","Part 119"],0,0,"Part 61 rege a certificação de pilotos."],["Which statement is correct?",["Foreign experience automatically grants FAA ATP","Eligibility must be checked against applicable FAA requirements","NFA issues FAA certificates"],1,1,"A elegibilidade depende das regras aplicáveis."]]}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let l=lessons[lesson];document.getElementById("status").textContent=lesson===5?"Aula 06 · 5 capítulos aprofundados · 40 questões originais":lesson===4?"Aula 05 · 16 capítulos · 20 questões":"Aula "+String(l.n).padStart(2,"0")+" · conteúdo estruturado em revisão editorial";
if(tab==="resumo"){el.innerHTML='<h2>'+esc(l.title)+'</h2><p>Estudo orientado para a certificação FAA ATP Airplane Multiengine Land (AMEL). Consulte sempre as normas vigentes e os requisitos aplicáveis ao seu caso.</p><p><strong>'+l.chap.length+' capítulos</strong> · '+(lesson===5?"duas baterias de 20 questões":lesson===4?"duas baterias de 10 questões":"avaliação introdutória de 2 questões")+'</p><p class="muted">As aulas 01–04 são versões estruturadas para revisão. A Aula 05 reúne os tópicos consolidados.</p><button class="primary" onclick="tab=\'aula\';render()">Abrir aula completa</button>'}
else if(tab==="aula"){el.innerHTML='<h2>'+esc(l.title)+'</h2>'+(lesson===5&&lesson6.englishChapters?lesson6EnglishView():l.chap.map((c,i)=>'<details id="c'+i+'"><summary>'+esc(c[0])+'</summary>'+(lesson===5?renderLesson6Markdown(c[1]):'<p>'+esc(c[1])+'</p>')+(lesson===0?'<div style="padding:12px;background:#f7f8f7;border-radius:9px;margin:12px 0"><strong>English · American aviation English</strong><p lang="en">'+esc(englishLessonOne[i][1])+'</p>'+'<p class="muted"><strong>Áudio em inglês americano · Capítulo '+(i+1)+'</strong></p><audio controls preload="none" style="width:100%;max-width:100%" src="audio/nfa_lesson01_chapter0'+(i+1)+'_natural.mp3"></audio>'+'</div>':'')+'<p><a target="_blank" rel="noopener" href="https://www.ecfr.gov/current/title-14">Consultar eCFR oficial</a></p></details>').join(""))+'<button class="primary" onclick="tab=\'avaliacao\';render()">Ir para avaliação</button>'}
else{let q=qs(),k=lesson+"-"+mode,arr=saved[k]||(saved[k]={answers:{},checked:{}}),item=q[idx],answered=Object.keys(arr.answers).length,score=q.filter((x,i)=>+arr.answers[i]===x[2]).length;el.innerHTML='<h2>Avaliação</h2>'+(lesson>=4?'<div class="modes"><button class="'+(!mode?"active":"")+'" onclick="mode=0;idx=0;render()">Prova teórica</button><button class="'+(mode?"active":"")+'" onclick="mode=1;idx=0;render()">Casos práticos</button></div>':'')+'<p class="muted">Questão '+(idx+1)+' de '+q.length+' · '+answered+' respondidas</p><div class="progress"><div style="width:'+(answered/q.length*100)+'%"></div></div><p class="question">'+esc(item[0])+'</p>'+item[1].map((o,i)=>'<label class="choice"><input type="radio" name="choice" value="'+i+'" '+(arr.answers[idx]===String(i)?"checked":"")+'>'+esc(o)+'</label>').join("")+'<button onclick="check()" '+(arr.answers[idx]===undefined?"disabled":"")+'>Ver correção</button>'+(arr.checked[idx]?'<div class="feedback"><strong>'+(+arr.answers[idx]===item[2]?"Resposta correta":"Revisão necessária")+'</strong><p>'+esc(item[4])+'</p><button onclick="review('+item[3]+')">Reestudar capítulo</button></div>':'')+'<div class="actions" style="margin-top:15px"><button onclick="idx--;render()" '+(idx===0?"disabled":"")+'>Anterior</button><button onclick="idx++;render()" '+(idx===q.length-1?"disabled":"")+'>Próxima</button></div><hr><button class="primary" onclick="result()" '+(answered!==q.length?"disabled":"")+'>Corrigir bateria completa</button><div id="result"></div>';document.querySelectorAll('input[name="choice"]').forEach(r=>r.onchange=e=>{arr.answers[idx]=e.target.value;delete arr.checked[idx];render()});}}
function check(){let a=saved[lesson+"-"+mode];a.checked[idx]=true;render()}
function review(c){tab="aula";render();let d=document.getElementById("c"+c);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}}
function result(){let q=qs(),a=saved[lesson+"-"+mode],score=q.filter((x,i)=>+a.answers[i]===x[2]).length;document.getElementById("result").innerHTML='<div class="feedback"><strong>Resultado: '+score+'/'+q.length+' ('+Math.round(score/q.length*100)+'%)</strong><p>'+(score/q.length>=.85?"Meta interna NFA atingida.":"Revise os erros antes de avançar.")+'</p>'+q.map((x,i)=>(+a.answers[i]===x[2]?"✓":"✗")+' Questão '+(i+1)+' — <button onclick="review('+x[3]+')">Capítulo '+(x[3]+1)+'</button><br>').join("")+'</div>'}
const curriculumModules=[["FAA Certification Fundamentals",["Understanding the FAA Certification System","ATP Eligibility Requirements","Foreign License Verification and Documentation","ATP Certification Pathway"]],["Federal Aviation Regulations",["Understanding 14 CFR and FAA Regulatory Authority","14 CFR Part 61 — Certification and Ratings","14 CFR Part 91 — General Operating Rules","14 CFR Parts 119, 121 and 135 — Air Carrier Operations"]],["Airspace & ATC",["US Airspace Classification","ATC Clearances and Readbacks","US ATC Procedures and Phraseology","Special Use Airspace and Operational Restrictions"]],["IFR Operations",["IFR Flight Planning","Instrument Departures and Arrivals","Instrument Approach Procedures","IFR Alternates, Fuel and Decision-Making"]],["Aviation Weather",["US Aviation Weather Products","METAR, TAF and Forecast Interpretation","Hazardous Weather and Operational Decisions","Weather-Related Risk Management"]],["Aircraft Performance",["Takeoff Performance","Climb and Cruise Performance","Landing Performance","Weight, Balance and Operational Limitations"]],["Navigation & Automation",["Navigation Systems and Performance-Based Navigation","RNAV, RNP and GPS Operations","Flight Management Systems and Automation","Mode Awareness and Navigation Monitoring"]],["Air Carrier Operations",["Air Carrier Regulatory Framework","Dispatch and Operational Control","Crew Qualifications and Operating Limitations","Standard Operating Procedures and Compliance"]],["Human Factors & CRM",["Crew Resource Management","Threat and Error Management","Situational Awareness and Workload","Human Performance and Decision-Making"]],["Abnormal Operations",["Abnormal and Emergency Procedures","System Failures and Prioritization","Rejected Takeoff and Go-Around Decisions","Diversions and Emergency Coordination"]],["ATP Knowledge Preparation",["ATP Knowledge Test Strategy","Regulations and Operations Review","Scenario-Based Knowledge Questions","Integrated Knowledge Assessment"]],["ATP Practical & Oral Preparation",["Airman Certification Standards Overview","Oral Examination Preparation","Practical Test Scenarios","Final Readiness and Individual Study Plan"]]];
const curriculumKey="nfa-atp-progress-v1";
let completedLessons={};
try{const value=JSON.parse(localStorage.getItem(curriculumKey)||"{}");if(value&&typeof value==="object"&&!Array.isArray(value))completedLessons=value}catch(e){}
const curriculumToggle=document.getElementById("curriculum-toggle");
const curriculumDetails=document.getElementById("curriculum-details");
const curriculumOverview=document.getElementById("curriculum-overview");
function curriculumRender(){
 const done=Object.keys(completedLessons).filter(k=>completedLessons[k]&&+k>=1&&+k<=6).length;
 curriculumOverview.innerHTML='<div class="curriculum-stats"><div class="curriculum-stat"><strong>12</strong><span>Módulos</span></div><div class="curriculum-stat"><strong>48</strong><span>Aulas previstas</span></div><div class="curriculum-stat"><strong>'+done+'/48</strong><span>Marcadas como estudadas</span></div></div><div class="curriculum-progress" role="progressbar" aria-label="Progresso declarado de estudo" aria-valuemin="0" aria-valuemax="48" aria-valuenow="'+done+'"><div style="width:'+(done/48*100)+'%"></div></div><p class="curriculum-note">6 aulas disponíveis · 42 planejadas. O progresso é marcado por você neste dispositivo; não equivale a aprovação nas avaliações.</p>';
 curriculumDetails.innerHTML=curriculumModules.map((m,mi)=>{
 const first=mi*4+1;
 return '<details class="curriculum-module" '+(mi===Math.floor(lesson/4)?'open':'')+'><summary>Módulo '+String(mi+1).padStart(2,'0')+' — '+esc(m[0])+' <span>· '+(first<=5?'aulas disponíveis e planejadas':'planejado')+'</span></summary><div class="curriculum-list">'+m[1].map((name,li)=>{
 const n=first+li,available=n<=6,selected=n===lesson+1;
 return '<div class="curriculum-lesson '+(selected?'curriculum-current':'')+'">'+(available?'<input class="curriculum-done" type="checkbox" data-complete="'+n+'" aria-label="Marcar aula '+n+' como estudada" '+(completedLessons[n]?'checked':'')+'>':'<span aria-hidden="true" style="width:19px"></span>')+'<button type="button" data-open-lesson="'+n+'">Aula '+String(n).padStart(2,'0')+' — '+esc(name)+'</button><span class="curriculum-tag '+(available?'available':'')+'">'+(available?'Disponível':'Planejada')+'</span></div>'}).join('')+'</div></details>'}).join('');
 curriculumDetails.querySelectorAll('[data-open-lesson]').forEach(b=>b.onclick=()=>{const n=+b.dataset.openLesson;if(n>6){const mi=Math.floor((n-1)/4),li=(n-1)%4;document.getElementById('curriculum-notice').innerHTML='<strong>Aula '+String(n).padStart(2,'0')+' — '+esc(curriculumModules[mi][1][li])+'</strong><p>Esta aula faz parte do programa previsto e ainda não possui conteúdo acadêmico publicado. As Aulas 01–06 estão disponíveis para estudo.</p>';document.getElementById('curriculum-notice').hidden=false;document.getElementById('curriculum-notice').scrollIntoView({behavior:'smooth',block:'center'});return}audioStop();lesson=n-1;tab="aula";mode=0;idx=0;document.getElementById("lesson").value=lesson;document.getElementById('curriculum-notice').hidden=true;render();document.getElementById("lesson").scrollIntoView({behavior:"smooth",block:"start"})});
 curriculumDetails.querySelectorAll('[data-complete]').forEach(c=>c.onchange=()=>{completedLessons[c.dataset.complete]=c.checked;try{localStorage.setItem(curriculumKey,JSON.stringify(completedLessons))}catch(e){}curriculumRender()});
}
curriculumToggle.onclick=()=>{const show=curriculumDetails.hidden;curriculumDetails.hidden=!show;curriculumToggle.textContent=show?'Ocultar programa':'Mostrar programa';curriculumToggle.setAttribute("aria-expanded",String(show));if(show)curriculumRender()};
const originalLessonChange=document.getElementById("lesson").onchange;
document.getElementById("lesson").onchange=e=>{originalLessonChange(e);if(!curriculumDetails.hidden)curriculumRender()};
curriculumRender();

render();
</script></body></html>
